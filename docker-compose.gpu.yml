# NVIDIA-näytönohjaimen käyttö Ollamalle (vaatii NVIDIA Container Toolkitin):
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
